name: Update README cards

on:
  schedule:
    # 00:00 IST (18:30 UTC) so the date + thought flip right after 11:59 PM India time.
    # Second slot is a safety net: GitHub sometimes delays/skips scheduled runs; a repeat run is a no-op.
    - cron: "30 18 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch: # Lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats cards + tech thought of the day
        run: |
          python scripts/generate_stats.py ${{ github.repository_owner }}
          python scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg assets/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
